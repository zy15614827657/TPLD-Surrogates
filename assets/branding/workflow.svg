<title id="title">TSYG research workflow</title><desc id="desc">Geometry and conditions are encoded into spatial representations, evolved over time, and decoded into physical fields. Flow autoencoder reconstruction additionally uses the true field.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#29b3a7" stroke-width="1.5"/></marker></defs>
